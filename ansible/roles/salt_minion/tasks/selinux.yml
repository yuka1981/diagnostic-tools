---
# SELinux configuration for Salt Minion
# Only applies to RHEL-family systems with SELinux enforcing

- name: Check SELinux status
  ansible.builtin.command:
    cmd: getenforce
  register: selinux_status
  changed_when: false
  failed_when: false

- name: Configure SELinux for Salt Minion
  when: selinux_status.stdout == 'Enforcing'
  block:
    - name: Install SELinux management tools
      ansible.builtin.dnf:
        name:
          - policycoreutils-python-utils
          - policycoreutils
          - checkpolicy
        state: present

    - name: Restore SELinux file contexts on Salt directories
      ansible.builtin.command:
        cmd: "restorecon -Rv {{ item }}"
      loop:
        - /etc/salt
        - /var/cache/salt
        - /var/run/salt
        - /var/log/salt
        - /opt/saltstack/salt
      register: restorecon_result
      changed_when: restorecon_result.stdout | default('') | length > 0
      failed_when: false

    - name: Copy Salt Minion SELinux policy module
      ansible.builtin.copy:
        src: salt_minion_selinux.te
        dest: /tmp/salt_minion_selinux.te
        mode: "0644"

    - name: Check if Salt Minion SELinux policy is installed
      ansible.builtin.shell:
        cmd: "semodule -l | grep -q salt_minion_selinux"
      register: selinux_policy_check
      changed_when: false
      failed_when: false

    - name: Compile Salt Minion SELinux policy module
      ansible.builtin.command:
        cmd: "checkmodule -M -m -o /tmp/salt_minion_selinux.mod /tmp/salt_minion_selinux.te"
      when: selinux_policy_check.rc != 0
      changed_when: true

    - name: Package Salt Minion SELinux policy module
      ansible.builtin.command:
        cmd: "semodule_package -o /tmp/salt_minion_selinux.pp -m /tmp/salt_minion_selinux.mod"
      when: selinux_policy_check.rc != 0
      changed_when: true

    - name: Install Salt Minion SELinux policy module
      ansible.builtin.command:
        cmd: "semodule -i /tmp/salt_minion_selinux.pp"
      when: selinux_policy_check.rc != 0
      changed_when: true
      notify: Restart salt-minion

    - name: Clean up temporary SELinux policy files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/salt_minion_selinux.te
        - /tmp/salt_minion_selinux.mod
        - /tmp/salt_minion_selinux.pp
