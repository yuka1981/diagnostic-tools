---
- name: Download SaltStack GPG key
  ansible.builtin.get_url:
    url: "https://repo.saltproject.io/salt/py3/{{ ansible_distribution | lower }}/{{ ansible_distribution_version }}/{{ ansible_architecture }}/SALT-PROJECT-GPG-PUBKEY-2023.gpg"
    dest: /etc/apt/keyrings/salt-archive-keyring.gpg
    mode: '0644'

- name: Add SaltStack APT repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture }} signed-by=/etc/apt/keyrings/salt-archive-keyring.gpg] https://repo.saltproject.io/salt/py3/{{ ansible_distribution | lower }}/{{ ansible_distribution_version }}/{{ ansible_architecture }}/{{ salt_version }} {{ ansible_distribution_release }} main"
    state: present
    filename: saltstack

- name: Install Salt Master and API packages
  ansible.builtin.apt:
    name:
      - salt-master
      - salt-api
      - python3-pygit2
    state: present
    update_cache: true

- name: Create Salt API PAM user
  ansible.builtin.user:
    name: "{{ salt_api_user }}"
    password: "{{ salt_api_password | password_hash('sha512') }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false
  no_log: true
