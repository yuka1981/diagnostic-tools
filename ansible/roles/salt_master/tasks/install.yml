---
# --- RHEL / Rocky / AlmaLinux (dnf) ---

- name: Install EPEL repository (RHEL)
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_os_family == 'RedHat'

- name: Enable CRB repository (RHEL)
  ansible.builtin.command:
    cmd: /usr/bin/crb enable
  register: crb_result
  changed_when: "'enabled' in crb_result.stdout"
  when: ansible_os_family == 'RedHat'

- name: Download Salt repo file (RHEL)
  ansible.builtin.get_url:
    url: https://github.com/saltstack/salt-install-guide/releases/latest/download/salt.repo
    dest: /etc/yum.repos.d/salt.repo
    mode: '0644'
  when: ansible_os_family == 'RedHat'

- name: Install Salt Master and API packages (RHEL)
  ansible.builtin.dnf:
    name:
      - salt-master
      - salt-api
      - patchelf
    state: present
  when: ansible_os_family == 'RedHat'

- name: Install pygit2 in Salt bundled Python (RHEL)
  ansible.builtin.pip:
    name: pygit2
    executable: /opt/saltstack/salt/bin/pip3
  when: ansible_os_family == 'RedHat'

# --- Debian / Ubuntu (apt) ---

- name: Download SaltStack GPG key (Debian)
  ansible.builtin.get_url:
    url: https://packages.broadcom.com/artifactory/api/security/keypair/SaltProjectKey/public
    dest: /etc/apt/keyrings/salt-archive-keyring.gpg
    mode: '0644'
  when: ansible_os_family == 'Debian'

- name: Add SaltStack APT repository (Debian)
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture }} signed-by=/etc/apt/keyrings/salt-archive-keyring.gpg] https://packages.broadcom.com/artifactory/saltproject-deb/ stable main"
    state: present
    filename: saltstack
  when: ansible_os_family == 'Debian'

- name: Install Salt Master and API packages (Debian)
  ansible.builtin.apt:
    name:
      - salt-master
      - salt-api
      - python3-pygit2
    state: present
    update_cache: true
  when: ansible_os_family == 'Debian'

# --- Common ---

- name: Create Salt API PAM user
  ansible.builtin.user:
    name: "{{ salt_api_user }}"
    password: "{{ salt_api_password | password_hash('sha512') }}"
    shell: /bin/bash
    system: true
    create_home: false
  no_log: true

- name: Create shadow group for PAM auth (RHEL)
  ansible.builtin.group:
    name: shadow
    system: true
    state: present
  when: ansible_os_family == 'RedHat'

- name: Add salt user to shadow group for PAM auth (RHEL)
  ansible.builtin.user:
    name: salt
    groups: shadow
    append: true
  notify: restart salt-master
  when: ansible_os_family == 'RedHat'

- name: Allow shadow group to read /etc/shadow (RHEL)
  ansible.builtin.file:
    path: /etc/shadow
    group: shadow
    mode: '0040'
  when: ansible_os_family == 'RedHat'
