version: "3.8"

services:
  prometheus:
    image: docker.io/prom/prometheus:v2.48.0
    container_name: qis-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - qis-monitoring

  pushgateway:
    image: docker.io/prom/pushgateway:v1.6.2
    container_name: qis-pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"
    networks:
      - qis-monitoring

  grafana:
    image: docker.io/grafana/grafana:10.2.2
    container_name: qis-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - qis-monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  qis-monitoring:
    driver: bridge
