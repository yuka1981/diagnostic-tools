name: Agent CI

on:
  push:
    branches: [ "develop", "master" ]
    paths:
      - 'agent/**'
      - '.github/workflows/agent-ci.yml'
  pull_request:
    branches: [ "develop", "master" ]
    paths:
      - 'agent/**'
      - '.github/workflows/agent-ci.yml'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./agent

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.23'
        cache-dependency-path: agent/go.sum

    - name: Verify dependencies
      run: go mod verify

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.63
        working-directory: agent
        args: --timeout=5m

    - name: Run tests
      run: go test -v ./...

    - name: Build
      env:
        CGO_ENABLED: 0
      run: go build -v ./...

